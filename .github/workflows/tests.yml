name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release tags run these tests via publish.yml, which publishes only if they pass
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: setup-python has no Python 3.8/3.9 builds
        # for Ubuntu 26.04, which ubuntu-latest moved to in October 2026
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v
